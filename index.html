<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Поймай сердечко 💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
    user-select: none;
  }

  body {
    background: linear-gradient(160deg, #ffd6e8 0%, #ffeaf4 40%, #e0d4ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 500px;
    max-height: 800px;
    overflow: hidden;
    border-radius: 0;
    background: linear-gradient(180deg, #fff5fa 0%, #ffe4f2 100%);
    box-shadow: 0 0 60px rgba(214, 51, 108, 0.25);
  }

  @media (min-width: 520px) {
    #game { border-radius: 30px; }
  }

  /* ---- HUD ---- */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    color: #d6336c;
    z-index: 20;
    font-size: 1.1em;
  }

  #scoreBox, #livesBox {
    background: rgba(255,255,255,0.7);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 12px rgba(214,51,108,0.15);
  }

  /* ---- Падающие объекты ---- */
  .falling {
    position: absolute;
    font-size: 40px;
    cursor: pointer;
    will-change: transform;
    user-select: none;
    transition: transform 0.1s;
    line-height: 1;
  }

  .falling:active { transform: scale(1.3); }

  /* ---- Всплывающий комплимент ---- */
  #toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    background: rgba(255,255,255,0.95);
    color: #d6336c;
    padding: 18px 24px;
    border-radius: 20px;
    font-size: 1.1em;
    font-weight: 600;
    text-align: center;
    max-width: 80%;
    box-shadow: 0 15px 40px rgba(214,51,108,0.3);
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: opacity 0.35s, transform 0.35s;
    line-height: 1.4;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ---- Экраны ---- */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    z-index: 40;
    background: rgba(255, 245, 250, 0.96);
    backdrop-filter: blur(8px);
  }

  .screen.hidden { display: none; }

  .screen h1 {
    font-size: 1.7em;
    color: #d6336c;
    margin-bottom: 14px;
    line-height: 1.3;
  }

  .screen p {
    color: #666;
    font-size: 1.05em;
    line-height: 1.6;
    margin-bottom: 10px;
    max-width: 360px;
  }

  .emoji-big {
    font-size: 4em;
    margin-bottom: 10px;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  button {
    font-family: inherit;
    font-size: 1.1em;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    border: none;
    border-radius: 50px;
    padding: 16px 40px;
    margin-top: 20px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(214, 51, 108, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  button:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(214,51,108,0.55); }
  button:active { transform: scale(0.96); }

  .final-message {
    font-size: 1.15em;
    color: #d6336c;
    font-weight: 600;
    line-height: 1.7;
    margin: 12px 0;
  }

  /* Всплеск при ловле */
  .sparkle {
    position: absolute;
    pointer-events: none;
    font-size: 22px;
    animation: sparkleOut 0.7s ease-out forwards;
    z-index: 15;
  }

  @keyframes sparkleOut {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(2.2) translateY(-40px); }
  }
</style>
</head>
<body>

<div id="game">
  <div id="hud">
    <div id="scoreBox">💖 <span id="score">0</span></div>
    <div id="livesBox"><span id="lives">🤍🤍🤍</span></div>
  </div>

  <div id="toast"></div>

  <!-- Стартовый экран -->
  <div class="screen" id="startScreen">
    <div class="emoji-big">💕</div>
    <h1>Поймай сердечко</h1>
    <p>Лови падающие сердечки пальчиком или мышкой 💗<br>
       Не дай им упасть — и собирай комплименты!</p>
    <button onclick="startGame()">Играть ✨</button>
  </div>

  <!-- Экран победы/конца -->
  <div class="screen hidden" id="endScreen">
    <div class="emoji-big" id="endEmoji">🎉</div>
    <h1 id="endTitle">Ты супер!</h1>
    <p class="final-message" id="endText"></p>
    <button onclick="restart()">Ещё раз 🔄</button>
  </div>
</div>

<script>
  // ====== НАСТРОЙКИ ======
  const GAME_DURATION = 45;          // секунд на игру
  const SPAWN_INTERVAL = 650;        // мс между появлением
  const FALL_SPEED_MIN = 1.6;        // px за кадр (мин)
  const FALL_SPEED_MAX = 3.4;        // px за кадр (макс)
  const COMPLIMENT_EVERY = 5;        // комплимент каждые N пойманных
  const START_LIVES = 3;

  const GOOD = ['💖','💕','💗','💓','💞','🌸','✨','💛'];
  const BAD  = ['💔','🌧️','😢'];

  const COMPLIMENTS = [
    "Ты самая красивая 💖",
    "Твоя улыбка согревает ☀️",
    "Ты умница и молодец 🌟",
    "С тобой всегда тепло 🤗",
    "Ты делаешь мир добрее 🌍",
    "Я тобой восхищаюсь 🥰",
    "Ты сильнее, чем думаешь 💪",
    "Спасибо, что ты есть 🌸",
    "Ты заслуживаешь всего лучшего 👑",
    "Ты — моё самое любимое чудо ✨"
  ];

  // ====== СОСТОЯНИЕ ======
  let score, lives, running, spawnTimer, rafId, endTime, lastTime, complimentIndex;
  const gameEl = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const toastEl = document.getElementById('toast');

  function random(min, max) { return Math.random() * (max - min) + min; }

  // ====== УПРАВЛЕНИЕ ======
  function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');

    score = 0;
    lives = START_LIVES;
    running = true;
    complimentIndex = 0;
    scoreEl.textContent = '0';
    updateLives();

    // Убираем старые объекты
    document.querySelectorAll('.falling').forEach(el => el.remove());

    endTime = performance.now() + GAME_DURATION * 1000;
    lastTime = performance.now();

    spawnTimer = setInterval(spawnObject, SPAWN_INTERVAL);
    rafId = requestAnimationFrame(loop);
  }

  function restart() { startGame(); }

  function updateLives() {
    livesEl.textContent = '🤍'.repeat(lives) + '❤️'.repeat(START_LIVES - lives)
      ? '💗'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(START_LIVES - lives,0))
      : '🖤'.repeat(START_LIVES);
  }

  // ====== СПАВН ======
  function spawnObject() {
    if (!running) return;

    const isBad = Math.random() < 0.18; // 18% плохих
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = isBad
      ? BAD[Math.floor(Math.random() * BAD.length)]
      : GOOD[Math.floor(Math.random() * GOOD.length)];

    const gw = gameEl.clientWidth;
    const size = 40;
    const x = random(10, gw - size - 10);
    const startY = -60;
    const speed = random(FALL_SPEED_MIN, FALL_SPEED_MAX) * (isBad ? 1.05 : 1);

    el.style.left = x + 'px';
    el.style.top = startY + 'px';
    el.dataset.y = startY;
    el.dataset.speed = speed;
    el.dataset.isBad = isBad ? '1' : '0';

    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      catchObject(el, isBad);
    });

    gameEl.appendChild(el);
  }

  // ====== ЛОВЛЯ ======
  function catchObject(el, isBad) {
    if (!running || el.dataset.caught) return;
    el.dataset.caught = '1';

    const rect = el.getBoundingClientRect();
    const gameRect = gameEl.getBoundingClientRect();
    const cx = rect.left - gameRect.left + rect.width / 2;
    const cy = rect.top - gameRect.top + rect.height / 2;

    sparkle(cx, cy, isBad ? '💔' : '✨');

    if (isBad) {
      lives--;
      updateLives();
      if (lives <= 0) { endGame(false); }
    } else {
      score++;
      scoreEl.textContent = score;

      if (score % COMPLIMENT_EVERY === 0) {
        showToast(COMPLIMENTS[complimentIndex % COMPLIMENTS.length]);
        complimentIndex++;
      }
    }

    el.remove();
  }

  // ====== ИГРОВОЙ ЦИКЛ ======
  function loop(now) {
    if (!running) return;

    const dt = Math.min((now - lastTime) / 16.67, 2.5); // нормализация к 60fps
    lastTime = now;

    document.querySelectorAll('.falling').forEach(el => {
      if (el.dataset.caught) return;
      let y = parseFloat(el.dataset.y) + parseFloat(el.dataset.speed) * dt;
      el.dataset.y = y;
      el.style.top = y + 'px';

      if (y > gameEl.clientHeight) {
        // упало
        if (el.dataset.isBad === '1') {
          el.remove(); // пропустить плохое — не страшно
        } else {
          // пропустили хорошее сердечко — теряем жизнь
          el.remove();
          lives--;
          updateLives();
          sparkle(el.offsetLeft + 20, gameEl.clientHeight - 40, '😢');
          if (lives <= 0) endGame(false);
        }
      }
    });

    if (now >= endTime) {
      endGame(true);
      return;
    }

    rafId = requestAnimationFrame(loop);
  }

  // ====== ЭФФЕКТЫ ======
  function sparkle(x, y, symbol) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = symbol;
    s.style.left = (x - 11) + 'px';
    s.style.top = (y - 11) + 'px';
    gameEl.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }

  let toastTimer;
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // ====== КОНЕЦ ИГРЫ ======
  function endGame(win) {
    running = false;
    clearInterval(spawnTimer);
    cancelAnimationFrame(rafId);
    document.querySelectorAll('.falling').forEach(el => el.remove());

    const endScreen = document.getElementById('endScreen');
    const endTitle = document.getElementById('endTitle');
    const endText = document.getElementById('endText');
    const endEmoji = document.getElementById('endEmoji');

    endScreen.classList.remove('hidden');

    if (win) {
      endEmoji.textContent = score >= 20 ? '👑' : '🎉';
      endTitle.textContent = score >= 20 ? 'Ты просто королева!' : 'Ты супер!';
      endText.innerHTML =
        `Ты поймала <b>${score}</b> сердечек 💖<br><br>
         Но главное — ты поймала моё сердце. Навсегда 💘<br><br>
         Отдохни, ты заслужила. Я рядом 🌙`;
    } else {
      endEmoji.textContent = '🤗';
      endTitle.textContent = 'Не беда!';
      endText.innerHTML =
        `Ты собрала <b>${score}</b> сердечек, но это неважно.<br><br>
         Важно то, что даже в игре ты — самая лучшая 💕<br>
         Попробуй ещё разок? 😊`;
    }
  }

  // Защита от случайного выделения/скролла на мобилке
  document.addEventListener('touchmove', e => {
    if (e.target.classList.contains('falling')) e.preventDefault();
  }, { passive: false });
</script>

</body>
</html>
